<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Win Tombola</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#ff0070;
  color:#222;
}

button,input{
  font-family:inherit;
}

/* =========================
   HEADER
========================= */

.header{
  background:#ff0068;
  color:white;
  padding:15px 10px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px #a00045;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.sub{
  font-size:13px;
  margin-top:4px;
}

/* =========================
   TOP GAME INFO
========================= */

.gameInfo{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
  margin-top:10px;
}

.gameBox{
  background:#07145e;
  color:white;
  border:4px solid #e9f900;
  border-radius:10px;
  min-height:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:5px;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 0 5px #fff;
}

#gameDateDisplay{
  font-size:17px;
}

#countdown{
  font-size:18px;
}

#gameTimeDisplay{
  font-size:17px;
}

/* =========================
   ADMIN BUTTON
========================= */

.adminBtn{
  margin-top:10px;
  border:0;
  background:#fff;
  color:#e90060;
  padding:8px 14px;
  border-radius:8px;
  font-weight:bold;
  font-size:15px;
}

/* =========================
   CONTAINER
========================= */

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.info{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
}

/* =========================
   TICKET
========================= */

.ticket{
  background:#ff005f;
  margin:15px 0;
}

.ticketHead{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
}

.ticketNo{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#ff6a48;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  flex-shrink:0;
}

.ticketName{
  flex:1;
  background:#ff6248;
  color:white;
  padding:14px 10px;
  font-size:19px;
  font-weight:bold;
  overflow:hidden;
}

/* =========================
   TICKET GRID
========================= */

.ticketGrid{
  background:#fff;
  border:6px solid #ff684e;
  border-radius:12px;
  overflow:hidden;
  display:grid;
  grid-template-columns:repeat(9,1fr);
}

.cell{
  min-height:58px;
  border:1px solid #ccc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  font-size:23px;
  font-weight:bold;
  background:#fff;
}

.empty{
  color:transparent;
}

/* =========================
   BOOK BUTTON
========================= */

.bookBtn{
  display:block;
  margin-left:auto;
  background:#ff754c;
  color:white;
  border:0;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.bookedBtn{
  background:#e65b45;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  padding:20px;
  overflow:auto;
}

.modalBox{
  max-width:500px;
  margin:30px auto;
  background:white;
  border-radius:15px;
  padding:20px;
}

.modalBox h2{
  margin-top:0;
  color:#ed005f;
}

.input{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.saveBtn{
  width:100%;
  background:#ed005f;
  color:white;
  border:0;
  padding:14px;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
}

.closeBtn{
  width:100%;
  margin-top:8px;
  background:#ddd;
  border:0;
  padding:12px;
  border-radius:8px;
}

.adminCard{
  background:#f7f7f7;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
}

.adminCard label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
}

.small{
  font-size:13px;
  color:#666;
}

.resetBtn{
  background:#d00;
  color:white;
  border:0;
  padding:12px;
  border-radius:8px;
  width:100%;
  margin-top:10px;
}

.emptyMessage{
  text-align:center;
  color:white;
  padding:40px 10px;
  font-size:18px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .logo{
    font-size:23px;
  }

  .sub{
    font-size:12px;
  }

  .gameInfo{
    gap:4px;
  }

  .gameBox{
    min-height:58px;
    padding:4px 2px;
    border-width:3px;
    font-size:14px;
  }

  #gameDateDisplay{
    font-size:13px;
  }

  #countdown{
    font-size:14px;
  }

  #gameTimeDisplay{
    font-size:13px;
  }

  .cell{
    min-height:43px;
    font-size:18px;
  }

  .ticketNo{
    width:48px;
    height:48px;
    font-size:18px;
  }

  .ticketName{
    font-size:16px;
    padding:12px 6px;
  }

  .bookBtn{
    padding:10px 11px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">

  <div class="logo">
    🎟️ WIN TOMBOLA
  </div>

  <div class="sub">
    Choose your ticket and book it
  </div>


  <!-- GAME INFORMATION -->

  <div class="gameInfo">

    <!-- GAME DATE -->
    <div class="gameBox" id="gameDateDisplay">
      --/--/----
    </div>

    <!-- COUNTDOWN -->
    <div class="gameBox" id="countdown">
      00:00:00
    </div>

    <!-- GAME TIME -->
    <div class="gameBox" id="gameTimeDisplay">
      --:-- --
    </div>

  </div>


  <button
    class="adminBtn"
    onclick="openAdminLogin()"
  >
    🔐 ADMIN
  </button>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="container">

  <div class="info">

    🎟️ Available Tickets:
    <span id="visibleCount">0</span>
    / 600

  </div>

  <div id="tickets"></div>

</div>


<!-- =========================
     ADMIN LOGIN
========================= -->

<div class="modal" id="loginModal">

  <div class="modalBox">

    <h2>🔐 Admin Login</h2>

    <input
      class="input"
      id="username"
      placeholder="Username"
      autocomplete="off"
    >

    <input
      class="input"
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      class="saveBtn"
      onclick="loginAdmin()"
    >
      LOGIN
    </button>

    <button
      class="closeBtn"
      onclick="closeModal('loginModal')"
    >
      CLOSE
    </button>

  </div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div class="modal" id="adminModal">

  <div class="modalBox">

    <h2>⚙️ Game Settings</h2>


    <!-- VISIBLE TICKETS -->

    <div class="adminCard">

      <label>
        🎟️ Visible Tickets
      </label>

      <input
        class="input"
        id="visibleTickets"
        type="number"
        min="1"
        max="600"
        placeholder="Example: 100"
      >

      <div class="small">
        Player ko Ticket 1 se yahan tak dikhenge.
        Example: 100 = Ticket 1–100.
      </div>

    </div>


    <!-- DATE + TIME -->

    <div class="adminCard">

      <label>
        📅 Game Date
      </label>

      <input
        class="input"
        id="gameDate"
        type="date"
      >


      <label>
        ⏰ Game Time
      </label>

      <input
        class="input"
        id="gameTime"
        type="time"
      >

    </div>


    <button
      class="saveBtn"
      onclick="saveSettings()"
    >
      💾 SAVE SETTINGS
    </button>


    <button
      class="resetBtn"
      onclick="resetBookings()"
    >
      🗑️ RESET ALL BOOKINGS
    </button>


    <button
      class="closeBtn"
      onclick="closeModal('adminModal')"
    >
      CLOSE
    </button>

  </div>

</div>


<script>

/* =========================
   ADMIN LOGIN
========================= */

const ADMIN_USERNAME = "gyandeep";
const ADMIN_PASSWORD = "785673";


/* =========================
   DEFAULT SETTINGS
========================= */

let settings =
  JSON.parse(
    localStorage.getItem("tombolaSettings")
  ) || {

    visibleTickets: 50,

    gameDate: "",

    gameTime: ""

  };


/* =========================
   BOOKINGS
========================= */

let bookings =
  JSON.parse(
    localStorage.getItem("tombolaBookings")
  ) || {};


/* =========================
   GENERATE TICKET NUMBERS
========================= */

function generateTicketNumbers(ticketNo){

  let numbers = [];

  let seed = ticketNo * 997;


  function random(){

    seed =
      (seed * 9301 + 49297)
      % 233280;

    return seed / 233280;
  }


  let columns = [];


  for(let c=0;c<9;c++){

    let min =
      c===0
      ? 1
      : c*10;

    let max =
      c===0
      ? 9
      : c===8
        ? 90
        : c*10+9;


    let arr=[];


    while(arr.length < 3){

      let n =
        Math.floor(
          random() *
          (max-min+1)
        ) + min;


      if(!arr.includes(n)){

        arr.push(n);

      }

    }


    columns.push(arr);

  }


  let result = [

    Array(9).fill(""),

    Array(9).fill(""),

    Array(9).fill("")

  ];


  for(let r=0;r<3;r++){

    let selected=[];


    while(selected.length < 5){

      let c =
        Math.floor(
          random()*9
        );


      if(!selected.includes(c)){

        selected.push(c);

      }

    }


    selected.sort(
      (a,b)=>a-b
    );


    selected.forEach(c=>{

      result[r][c] =
        columns[c][r];

    });

  }


  return result;
}


/* =========================
   RENDER TICKETS
========================= */

function renderTickets(){

  const box =
    document.getElementById("tickets");


  box.innerHTML = "";


  let total =
    Math.min(
      600,
      Math.max(
        1,
        Number(settings.visibleTickets)
      )
    );


  document.getElementById(
    "visibleCount"
  ).textContent = total;


  if(total <= 0){

    box.innerHTML = `
      <div class="emptyMessage">
        No tickets available.
      </div>
    `;

    return;
  }


  for(let i=1;i<=total;i++){

    const booked =
      bookings[i] &&
      bookings[i].booked === true;


    const numbers =
      generateTicketNumbers(i);


    let cells = "";


    for(let r=0;r<3;r++){

      for(let c=0;c<9;c++){

        let value =
          numbers[r][c];


        cells += `

          <div
            class="cell ${
              value==="" ? "empty" : ""
            }"
          >
            ${value}
          </div>

        `;

      }

    }


    box.innerHTML += `

      <div class="ticket">

        <div class="ticketHead">

          <div class="ticketNo">
            ${i}
          </div>

          <div class="ticketName">
            ${
              booked
              ? "BOOKED"
              : "UNSOLD"
            }
          </div>

        </div>


        <div class="ticketGrid">

          ${cells}

        </div>


        <div style="padding:7px 0">

          <button

            class="bookBtn ${
              booked
              ? "bookedBtn"
              : ""
            }"

            ${
              booked
              ? "disabled"
              : `onclick="bookTicket(${i})"`
            }

          >

            ${
              booked
              ? "BOOKED"
              : "BOOK THIS"
            }

          </button>

        </div>

      </div>

    `;

  }

}


/* =========================
   BOOK TICKET
========================= */

function bookTicket(ticketNo){

  if(bookings[ticketNo]?.booked){

    alert(
      "This ticket is already booked."
    );

    return;
  }


  let name =
    prompt(
      "Enter your name for Ticket " +
      ticketNo
    );


  if(!name){

    return;
  }


  let phone =
    prompt(
      "Enter your WhatsApp/mobile number"
    );


  if(!phone){

    return;
  }


  bookings[ticketNo] = {

    booked:true,

    name:name,

    phone:phone,

    time:new Date().toISOString()

  };


  localStorage.setItem(
    "tombolaBookings",
    JSON.stringify(bookings)
  );


  renderTickets();


  alert(
    "Ticket " +
    ticketNo +
    " booked successfully!"
  );

}


/* =========================
   OPEN ADMIN LOGIN
========================= */

function openAdminLogin(){

  document.getElementById(
    "loginModal"
  ).style.display="block";

}


/* =========================
   LOGIN ADMIN
========================= */

function loginAdmin(){

  const user =
    document.getElementById(
      "username"
    ).value.trim();


  const pass =
    document.getElementById(
      "password"
    ).value;


  if(
    user === ADMIN_USERNAME &&
    pass === ADMIN_PASSWORD
  ){

    closeModal("loginModal");

    openAdminPanel();

  }else{

    alert(
      "Wrong username or password."
    );

  }

}


/* =========================
   ADMIN PANEL
========================= */

function openAdminPanel(){

  document.getElementById(
    "visibleTickets"
  ).value =
    settings.visibleTickets;


  document.getElementById(
    "gameDate"
  ).value =
    settings.gameDate;


  document.getElementById(
    "gameTime"
  ).value =
    settings.gameTime;


  document.getElementById(
    "adminModal"
  ).style.display="block";

}


/* =========================
   SAVE SETTINGS
========================= */

function saveSettings(){

  let visible =
    parseInt(
      document.getElementById(
        "visibleTickets"
      ).value
    );


  if(
    isNaN(visible) ||
    visible < 1 ||
    visible > 600
  ){

    alert(
      "Visible Tickets 1 se 600 ke beech hona chahiye."
    );

    return;
  }


  settings.visibleTickets =
    visible;


  settings.gameDate =
    document.getElementById(
      "gameDate"
    ).value;


  settings.gameTime =
    document.getElementById(
      "gameTime"
    ).value;


  localStorage.setItem(
    "tombolaSettings",
    JSON.stringify(settings)
  );


  renderTickets();

  updateGameDisplay();


  alert(
    "Settings saved successfully!"
  );


  closeModal(
    "adminModal"
  );

}


/* =========================
   RESET BOOKINGS
========================= */

function resetBookings(){

  let ok =
    confirm(
      "Are you sure you want to reset ALL bookings?"
    );


  if(!ok){

    return;
  }


  bookings = {};


  localStorage.setItem(
    "tombolaBookings",
    JSON.stringify(bookings)
  );


  renderTickets();


  alert(
    "All bookings reset."
  );

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(id){

  document.getElementById(
    id
  ).style.display="none";

}


/* =========================
   FORMAT GAME DATE
========================= */

function formatGameDate(dateString){

  if(!dateString){

    return "--/--/----";

  }


  let parts =
    dateString.split("-");


  if(parts.length !== 3){

    return "--/--/----";

  }


  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


/* =========================
   FORMAT GAME TIME
========================= */

function formatGameTime(timeString){

  if(!timeString){

    return "--:-- --";

  }


  let parts =
    timeString.split(":");


  let hour =
    parseInt(parts[0]);


  let minute =
    parts[1];


  let ampm =
    hour >= 12
    ? "PM"
    : "AM";


  hour =
    hour % 12;


  if(hour === 0){

    hour = 12;

  }


  return (
    String(hour).padStart(2,"0") +
    ":" +
    minute +
    " " +
    ampm
  );

}


/* =========================
   UPDATE GAME DATE/TIME
========================= */

function updateGameDisplay(){

  document.getElementById(
    "gameDateDisplay"
  ).textContent =
    formatGameDate(
      settings.gameDate
    );


  document.getElementById(
    "gameTimeDisplay"
  ).textContent =
    formatGameTime(
      settings.gameTime
    );


  updateCountdown();

}


/* =========================
   COUNTDOWN
========================= */

function updateCountdown(){

  const el =
    document.getElementById(
      "countdown"
    );


  if(
    !settings.gameDate ||
    !settings.gameTime
  ){

    el.textContent =
      "00:00:00";

    return;

  }


  const target =
    new Date(
      settings.gameDate +
      "T" +
      settings.gameTime +
      ":00"
    );


  const now =
    new Date();


  let diff =
    target.getTime() -
    now.getTime();


  if(diff <= 0){

    el.textContent =
      "GAME STARTED";

    return;

  }


  let days =
    Math.floor(
      diff /
      (1000*60*60*24)
    );


  diff %=
    (1000*60*60*24);


  let hours =
    Math.floor(
      diff /
      (1000*60*60)
    );


  diff %=
    (1000*60*60);


  let minutes =
    Math.floor(
      diff /
      (1000*60)
    );


  diff %=
    (1000*60);


  let seconds =
    Math.floor(
      diff / 1000
    );


  /*
    Agar 1 din se kam hai:
    00:44:05

    Agar din zyada hai:
    1D 00:44:05
  */


  if(days > 0){

    el.textContent =
      days +
      "D " +
      String(hours).padStart(2,"0") +
      ":" +
      String(minutes).padStart(2,"0") +
      ":" +
      String(seconds).padStart(2,"0");

  }else{

    el.textContent =
      String(hours).padStart(2,"0") +
      ":" +
      String(minutes).padStart(2,"0") +
      ":" +
      String(seconds).padStart(2,"0");

  }

}


/* =========================
   START
========================= */

renderTickets();

updateGameDisplay();


setInterval(
  updateGameDisplay,
  1000
);

</script>

</body>
</html>
